name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  helper:
    name: Swift helper build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Build and test
        working-directory: helper
        run: swift test

  workers:
    name: Speech recognition workers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          cmake --version
      - name: Build workers
        run: bash asr/build.sh whisper-coreml apple parakeet
      - name: Smoke test
        run: |
          # Every worker prints a "ready" message on startup and exits when stdin closes. No model is needed for this.
          os_major="$(sw_vers -productVersion | cut -d. -f1)"
          for w in whisper whisper-coreml parakeet apple; do
            bin="asr/build/longhand-asr-$w"
            test -x "$bin"
            if [ "$w" = apple ] && [ "$os_major" -lt 26 ]; then
              echo "$w: built (not started: needs macOS 26, runner has $os_major)"
              continue
            fi
            first="$(printf '' | "$bin" | head -n 1)"
            echo "$w: $first"
            echo "$first" | grep -q '"type":"ready"'
          done
